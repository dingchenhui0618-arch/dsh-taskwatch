<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<title>任务监控 · 演示数据</title>
<link rel="manifest" href="/taskwatch/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/taskwatch/icon-192.png">
<link rel="apple-touch-icon" href="/taskwatch/icon-192.png">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="任务监控">
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#282d38;--fg:#e8ebf0;--dim:#98a1b3;--ok:#3ecf8e;--warn:#e2b23c;--err:#ef5f6b;--acc:#5b8cff}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--line:#e2e5ea;--fg:#16181d;--dim:#5f6879;--ok:#1f9d63;--warn:#9a7411;--err:#c5303c;--acc:#2f5fd0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
#meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
main{padding:14px 12px 40px;display:flex;flex-direction:column;gap:12px;max-width:860px;margin:0 auto}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.chip b{color:var(--fg);font-weight:650}
.card{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 14px}
.card>h2{margin:0 0 8px;font-size:13px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg)}
.card.alert{border-color:var(--warn)}
.card.alert.hot{border-color:var(--err)}
.card.offline{border-color:var(--err);background:linear-gradient(0deg,rgba(239,95,107,.10),rgba(239,95,107,.10))}
.n{font-size:11px;color:var(--dim);font-weight:500}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block{color:var(--dim);font-size:12px;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{flex:0 0 auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--dim)}
.dot.run{background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.16)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.empty{color:var(--dim);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar>i.warn{background:var(--warn)}
.bar>i.err{background:var(--err)}
footer{color:var(--dim);font-size:11px;text-align:center;padding:0 16px calc(20px + env(safe-area-inset-bottom))}

/* 会话卡片：可点开。.sess 自带分隔线，避免行被包裹后丢掉 border-top。 */
.sess{border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0}
.sess>.row{border-top:0}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active{background:rgba(128,140,170,.10);border-radius:8px}
.tri{flex:0 0 auto;width:11px;color:var(--dim);font-size:11px;margin-top:5px;transition:transform .12s}
.tri.open{transform:rotate(90deg);color:var(--acc)}
.exp{padding:2px 0 12px 21px;display:flex;flex-direction:column;gap:9px}
.sec{border-left:2px solid var(--line);padding-left:9px}
.sec>h3{margin:0 0 3px;font-size:11px;font-weight:600;color:var(--dim)}
.msg{border-left:2px solid var(--line);padding:1px 0 1px 9px}
.msg.u{border-left-color:var(--ok)}
.msg.a{border-left-color:var(--acc)}
.msg .who{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;max-height:15em;overflow:auto}
.msg .tls{font-size:10.5px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:1px}
.warnbox{color:var(--err);font-size:12px;overflow-wrap:anywhere}
.loading{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><h1>任务监控</h1><div id="meta">演示数据</div></header>
<main id="root"></main>
<footer id="foot">演示数据 · 非真实状态</footer>
<script>
var root=document.getElementById('root'),meta=document.getElementById('meta'),foot=document.getElementById('foot');
var ES={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return ES[c]})}
function ago(t,now){if(!t)return '—';var s=Math.max(0,Math.round((now-t)/1000));if(s<60)return s+'s 前';var m=Math.floor(s/60);if(m<60)return m+'m 前';var h=Math.floor(m/60);if(h<24)return h+'h 前';return Math.floor(h/24)+'d 前'}
function dur(a,b,now){if(!a)return '—';var s=Math.max(0,Math.round(((b||now)-a)/1000));if(s<60)return s+'s';var m=Math.floor(s/60);if(m<60)return m+'m'+(s%60)+'s';var h=Math.floor(m/60);return h+'h'+(m%60)+'m'}
function dot(status){var c=status==='running'?'run':(status==='stopping'?'warn':(status==='failed'||status==='killed'?'err':''));return '<span class="dot '+c+'"></span>'}
function hhmmss(t){try{return new Date(t).toLocaleTimeString('zh-CN',{hour12:false})}catch(e){return '--:--:--'}}
function chips(t){return '<div class="chips">'
 +'<span class="chip"><b>'+t.sessions+'</b> 会话</span>'
 +'<span class="chip"><b>'+t.running+'</b> 运行中</span>'
 +'<span class="chip"><b>'+t.jobs+'</b> 后台任务</span>'
 +'<span class="chip"><b>'+t.jobsRunning+'</b> 任务运行</span>'
 +'<span class="chip"><b>'+t.subagents+'</b> 子代理</span>'
 +'<span class="chip"><b>'+t.workflows+'</b> 工作流</span>'
 +'</div>'}

/* ---- 跨轮询保留的状态 ----------------------------------------------------
 * OPEN  : 会话 id -> true        展开的会话。轮询重建 DOM 后据此重新展开。
 * CONVO : 会话 id -> 对话缓存     点开时懒加载一次，之后轮询不再重复请求。
 * LAST  : 上一次数据的序列化      用于「数据没变就完全不碰 DOM」。
 * CACHE : 最后一次成功的数据对象  点击/对话到达时用它就地重画。
 * FAILS : 连续失败次数           用来把「断连」显式说出来。
 */
var OPEN={},CONVO={},LAST='',CACHE=null,FAILS=0;

function byOwner(d,sid){
  var out={jobs:[],subs:[],pend:[]},i;
  for(i=0;i<d.jobs.length;i++)if(d.jobs[i].owner===sid)out.jobs.push(d.jobs[i]);
  for(i=0;i<d.subagents.length;i++)if(d.subagents[i].parent===sid)out.subs.push(d.subagents[i]);
  for(i=0;i<d.pending.length;i++)if(d.pending[i].session===sid)out.pend.push(d.pending[i]);
  return out}

function convoHtml(sid){
  var c=CONVO[sid];
  if(!c)return '';
  if(c.loading)return '<div class="sec"><h3>最近对话</h3><div class="loading">读取中…</div></div>';
  if(c.error)return '<div class="sec"><h3>最近对话</h3><div class="warnbox">'+esc(c.error)+'</div></div>';
  if(!c.messages.length)return '<div class="sec"><h3>最近对话</h3><div class="empty">没有可显示的消息。</div></div>';
  var h='<div class="sec"><h3>最近对话'+(c.total>c.messages.length?'（共 '+c.total+' 条，显示最后 '+c.messages.length+' 条）':'')+'</h3>';
  for(var i=0;i<c.messages.length;i++){
    var m=c.messages[i],u=m.role==='user';
    h+='<div class="msg '+(u?'u':'a')+'"><div class="who"><span>'+(u?'你':'助手')+'</span>'
      +(m.at?'<span>'+esc(hhmmss(m.at))+'</span>':'')+'</div>'
      +(m.text?'<div class="tx">'+esc(m.text)+'</div>':'')
      +((m.tools&&m.tools.length)?'<div class="tls">工具：'+esc(m.tools.join(' · '))+'</div>':'')
      +'</div>'}
  return h+'</div>'}

function expHtml(x,d){
  var o=byOwner(d,x.id),h='<div class="exp">';
  if(x.goal){
    h+='<div class="sec"><h3>目标</h3>'
      +'<div class="dim">阶段 '+esc(x.goal.phase)+' · 轮次 '+x.goal.roundsStarted+'/'+x.goal.maxGoalRounds
      +(x.goal.activation==='disarmed'?' · 未续跑':'')+'</div>'
      +((x.goal.objective)?'<div class="block">'+esc(x.goal.objective)+'</div>':'')
      +((x.goal.blockedMessage)?'<div class="warnbox">阻塞：'+esc(x.goal.blockedMessage)+'</div>':'')
      +'</div>'}
  if(o.pend.length){h+='<div class="sec"><h3>待你介入</h3>';
    for(var i=0;i<o.pend.length;i++){var p=o.pend[i];h+='<div class="name">'+esc(p.title)+'</div>'+((p.detail)?'<div class="dim">'+esc(p.detail)+'</div>':'')+'<div class="mono">'+esc(p.kind)+'</div>'}
    h+='</div>'}
  h+='<div class="sec"><h3>后台任务（'+o.jobs.length+'）</h3>';
  if(!o.jobs.length)h+='<div class="empty">这个会话没有后台任务。</div>';
  else for(var j=0;j<o.jobs.length;j++){var b=o.jobs[j];
    h+='<div class="row">'+dot(b.status)+'<div class="grow"><div class="name">'+esc(b.label||b.id)+'</div>'
      +'<div class="mono">'+esc(b.id)+' · '+esc(b.kind)+' · '+esc(b.status)+'</div>'
      +((b.detail)?'<div class="dim">'+esc(b.detail)+'</div>':'')
      +'</div><div class="right">'+dur(b.startedAt,b.finishedAt,d.generatedAt||Date.now())+'</div></div>'}
  h+='</div>';
  h+='<div class="sec"><h3>子代理（'+o.subs.length+'）</h3>';
  if(!o.subs.length)h+='<div class="empty">这个会话没有子代理。</div>';
  else for(var k=0;k<o.subs.length;k++){var s=o.subs[k];
    h+='<div class="row">'+dot(s.activity==='running'?'running':'idle')+'<div class="grow"><div class="name">'+esc(s.label||s.id)+'</div>'
      +'<div class="dim">'+esc(s.mode)+' · '+esc(s.activity)+' · 深度'+s.depth+'</div></div></div>'}
  h+='</div>';
  h+=convoHtml(x.id);
  return h+'</div>'}

function build(d){
  var now=d.generatedAt||Date.now(),h='',i,x;
  if(d.offline)h+='<section class="card offline"><h2>离线快照</h2><div class="warnbox">没读到 DSH，下面是空数据，不代表真的没有任务。</div></section>';
  h+=chips(d.totals);
  h+='<section class="card'+(d.totals.pending?' alert hot':'')+'"><h2>需要你介入<span class="n">'+d.pending.length+'</span></h2>';
  if(!d.pending.length)h+='<div class="empty">当前没有等待中的审批或提问。</div>';
  else for(i=0;i<d.pending.length;i++){x=d.pending[i];
    h+='<div class="row">'+dot('warn')+'<div class="grow"><div class="name">'+esc(x.title)+'</div>'
      +((x.detail)?'<div class="dim">'+esc(x.detail)+'</div>':'')
      +'<div class="mono">'+esc(x.kind)+' · '+esc(x.session)+'</div></div><div class="right">'+ago(x.at,now)+'</div></div>'}
  h+='</section>';

  h+='<section class="card"><h2>会话<span class="n">'+d.sessions.length+' · 点开看详情</span></h2>';
  if(!d.sessions.length)h+='<div class="empty">没有活着的会话。</div>';
  else for(i=0;i<d.sessions.length&&i<40;i++){x=d.sessions[i];
    var open=!!OPEN[x.id];
    h+='<div class="sess"><div class="row tap" data-sid="'+esc(x.id)+'">'
      +'<span class="tri'+(open?' open':'')+'">▶</span>'
      +dot(x.running?'running':(x.activeJobs?'stopping':'idle'))
      +'<div class="grow"><div class="name">'+esc(x.title||x.id)+'</div>'
      +'<div class="mono">'+esc(x.id)+'</div>'
      +'<div class="dim">'+(x.running?'运行中':'空闲')+((x.activeJobs)?' · '+x.activeJobs+' 个任务在跑':'')+((x.live)?'':' · 仅日志')+((x.origin==='subagent')?' · 子代理':'')+((x.depth)?' · 深度'+x.depth:'')+((x.preset)?' · '+esc(x.preset):'')+'</div>'
      /* 目标块在展开后的详情里会完整再现（阶段/轮次/objective/阻塞），
       * 所以展开时这里收起来 —— 否则同一屏里同样的字出现两遍，看着像 bug。
       * 收起不会丢信息：阻塞原因在详情里是更醒目的 warnbox。 */
      +((x.goal&&!open)?'<div class="dim">目标 '+esc(x.goal.phase)+' · 轮次 '+x.goal.roundsStarted+'/'+x.goal.maxGoalRounds+(x.goal.activation==='disarmed'?' · 未续跑':'')+'</div>':'')
      +((x.goal&&x.goal.objective&&!open)?'<div class="block">'+esc(x.goal.objective)+'</div>':'')
      +((x.goal&&x.goal.blockedMessage&&!open)?'<div class="block">阻塞：'+esc(x.goal.blockedMessage)+'</div>':'')
      +((x.goal&&x.goal.maxGoalRounds&&!open)?'<div class="bar"><i class="'+(x.goal.phase==='blocked'?'err':(x.goal.phase==='paused'?'warn':''))+'" style="width:'+Math.min(100,Math.round(100*x.goal.roundsStarted/x.goal.maxGoalRounds))+'%"></i></div>':'')
      +'</div><div class="right">'+ago(x.lastActivity,now)+'</div></div>'
      +(open?expHtml(x,d):'')
      +'</div>'}
  if(d.sessions.length>40)h+='<div class="empty">还有 '+(d.sessions.length-40)+' 条未显示</div>';
  h+='</section>';

  h+='<section class="card"><h2>后台任务<span class="n">'+d.jobs.length+'</span></h2>';
  if(!d.jobs.length)h+='<div class="empty">没有后台任务。</div>';
  else for(i=0;i<d.jobs.length&&i<40;i++){x=d.jobs[i];
    h+='<div class="row">'+dot(x.status)+'<div class="grow"><div class="name">'+esc(x.label||x.id)+'</div>'
      +'<div class="mono">'+esc(x.id)+' · '+esc(x.kind)+' · '+esc(x.status)+'</div>'
      +((x.detail)?'<div class="dim">'+esc(x.detail)+'</div>':'')
      +'</div><div class="right">'+dur(x.startedAt,x.finishedAt,now)+'</div></div>'}
  h+='</section>';

  h+='<section class="card"><h2>子代理树<span class="n">'+d.subagents.length+'</span></h2>';
  if(!d.subagents.length)h+='<div class="empty">没有子代理。</div>';
  else for(i=0;i<d.subagents.length&&i<40;i++){x=d.subagents[i];
    h+='<div class="row">'+dot(x.activity==='running'?'running':'idle')+'<div class="grow"><div class="name">'+esc(x.label||x.id)+'</div>'
      +'<div class="mono">'+esc(x.id)+'</div>'
      +'<div class="dim">'+esc(x.mode)+' · '+esc(x.activity)+' · 深度'+x.depth+' · 父 '+esc(x.parent)+'</div></div></div>'}
  h+='</section>';

  h+='<section class="card"><h2>工作流<span class="n">'+d.workflows.length+'</span></h2>';
  if(!d.workflows.length)h+='<div class="empty">没有运行中的工作流。</div>';
  else for(i=0;i<d.workflows.length;i++){x=d.workflows[i];
    h+='<div class="row">'+dot('running')+'<div class="grow"><div class="name">'+esc(x.name||x.id)+'</div>'
      +'<div class="dim">阶段：'+esc(x.phase||'—')+'</div>'
      +'<div class="mono">'+esc(x.id)+' · '+x.logs+' 条日志</div></div><div class="right">'+dur(x.startedAt,0,now)+'</div></div>'}
  h+='</section>';

  if(d.errors&&d.errors.length)h+='<section class="card"><h2>采集诊断</h2>'+d.errors.map(function(e){return '<div class="mono">'+esc(e)+'</div>'}).join('')+'</section>';
  return h}

/* 数据没变就完全不碰 DOM —— 这样页面不再每 3 秒抽动一次，
 * 滚动位置和手指正在点的目标都不会被打断。 */
function render(d,force){
  var sig;
  try{sig=JSON.stringify(d)}catch(e){sig=String(Math.random())}
  if(!force&&sig===LAST){meta.textContent=hhmmss(d.generatedAt||Date.now())+' 更新';return}
  LAST=sig;CACHE=d;
  var y=window.scrollY||window.pageYOffset||0;
  root.innerHTML=build(d);
  window.scrollTo(0,y);
  meta.textContent=hhmmss(d.generatedAt||Date.now())+' 更新'}

function loadConvo(sid){
  CONVO[sid]={loading:true,error:null,messages:[],total:0};
  if(CACHE)render(CACHE,true);
  fetch('/taskwatch/session?id='+encodeURIComponent(sid)+'&limit=20',{cache:'no-store'})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
   .then(function(j){CONVO[sid]={loading:false,error:j.error||null,messages:j.messages||[],total:j.total||0};if(CACHE)render(CACHE,true)})
   .catch(function(e){CONVO[sid]={loading:false,error:'读取失败：'+e,messages:[],total:0};if(CACHE)render(CACHE,true)})}

/* 事件委托挂在常驻容器上，所以内层 DOM 被重建也不会丢监听。 */
root.addEventListener('click',function(ev){
  var el=ev.target;
  while(el&&el!==root){
    if(el.getAttribute&&el.getAttribute('data-sid')){
      var sid=el.getAttribute('data-sid');
      if(OPEN[sid])delete OPEN[sid];
      else{OPEN[sid]=true;if(!CONVO[sid])loadConvo(sid)}
      if(CACHE)render(CACHE,true);
      return}
    el=el.parentNode}});

function tick(){
  fetch('/taskwatch/data',{cache:'no-store'})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
   .then(function(d){
     FAILS=0;
     foot.textContent=d.offline?'离线快照 · 未读到 DSH':'只读视图 · 3 秒自动刷新';
     render(d)})
   .catch(function(e){
     FAILS++;
     foot.textContent='连接失败（连续 '+FAILS+' 次）：'+e;
     meta.textContent='最后成功 '+hhmmss(CACHE&&CACHE.generatedAt||0)})}
