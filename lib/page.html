<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#151517" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DSH 助手">
<title>DSH 助手</title>
<!-- 主题引导：必须在 <style> 之前跑，否则会先闪一下亮色。
     默认跟随系统，用户在顶栏手动切过之后以手动为准（存 localStorage）。 -->
<script>
(function () {
  var t = ''
  try { t = localStorage.getItem('taskwatch.theme') || '' } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches) ? 'dark' : 'light'
  }
  document.documentElement.setAttribute('data-theme', t)
})()
</script>
<link rel="manifest" href="/taskwatch/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/taskwatch/icon-192.png">
<link rel="apple-touch-icon" href="/taskwatch/icon-192.png">
<style>
/* ---------------------------------------------------------------------------
   手机对话页。

   设计目标只有一句：**小白点进来也看得懂**。
   所以这里刻意不做仪表盘 —— 顶部一行说人话的状态，中间是对话，
   底部是输入框；数据表格收进抽屉，想看才展开。

   三条铁律（改这个文件时请保持）：
     1. 宿主或模型来的文本一律先 esc() 再进 DOM。
     2. 流式增量只追加到**那一个**气泡节点，不整页重建。
     3. 工具名先翻译成人话再显示。
--------------------------------------------------------------------------- */
/* ══ 设计令牌 ══════════════════════════════════════════════════════════════
   真值全部取自 DSH 客户端安装包（app.asar 里的 --dsw-static-* / --dsw-alias-*），
   变量名与客户端保持一致。这不是"照着感觉调得像"，而是同一套令牌 ——
   客户端以后换主题，改这一个块就行。

   两条规矩（改这个文件时请保持）：
     1. hex / rgba **只准出现在这个块里**；块外一律用 var()，不许逐屏硬编码颜色。
     2. 亮色是默认值，暗色覆盖在 :root[data-theme='dark'] 里，只有一份。

   抄自客户端的原值：
     蓝调中性 00 #fff · 50 #f9fafb · 60 #f5f6f7 · 75 #f1f3f5 · 100 #ebeef2
              150 #e9ecf2 · 200 #e1e5ee · 300 #cfd3d6 · 400 #adb2b8 · 500 #979da6
              600 #81858c · 700 #61666b · 750 #43454a · 800 #353638 · 850 #2c2c2e
              875 #232324 · 900 #1b1b1c · 950 #151517 · 1000 #0f1115
     品牌蓝 #4176e6（--dsw-alias-brand-primary-new-color）
     状态 绿 #22c55e · 琥珀 #f59e0b · 红 #ec1313（暗色用红 400 #f25a5a）
   ════════════════════════════════════════════════════════════════════════ */
:root{
  /* ── 客户端静态色阶（原值照抄，一个都没改） ── */
  --nb-00:#fff;      --nb-50:#f9fafb;   --nb-60:#f5f6f7;   --nb-75:#f1f3f5;
  --nb-100:#ebeef2;  --nb-150:#e9ecf2;  --nb-200:#e1e5ee;  --nb-300:#cfd3d6;
  --nb-400:#adb2b8;  --nb-500:#979da6;  --nb-600:#81858c;  --nb-700:#61666b;
  --nb-750:#43454a;  --nb-800:#353638;  --nb-850:#2c2c2e;  --nb-875:#232324;
  --nb-900:#1b1b1c;  --nb-950:#151517;  --nb-1000:#0f1115;
  --blue-450:#4d93f8; --blue-600:#2563eb;
  --green-500:#22c55e; --amber-500:#f59e0b; --red-600:#ec1313; --red-400:#f25a5a;

  /* ── 客户端圆角与字体（原值） ── */
  --dsw-radius-xs:4px; --dsw-radius-sm:8px; --dsw-radius-md:12px;
  --dsw-radius-lg:16px; --dsw-radius-xl:20px;
  --dsw-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --dsw-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* ── 语义令牌 · 亮色（默认） ── */
  --dsw-alias-bg-base:var(--nb-00);
  --dsw-alias-bg-layer-1:var(--nb-00);
  --dsw-alias-bg-layer-2:var(--nb-00);
  --dsw-alias-bg-overlay:var(--nb-150);
  --dsw-alias-label-primary:var(--nb-1000);
  --dsw-alias-label-secondary:var(--nb-700);
  --dsw-alias-label-tertiary:var(--nb-600);
  --dsw-alias-border-l1:#0000000a;
  --dsw-alias-border-l2:#0000001a;
  /* 别被名字骗了：客户端的 --dsw-alias-brand-primary 其实是**中性色**
     （亮 #0f1115 / 暗 #f9fafb），不是蓝色。蓝色是 -new-color。
     2026-10-08 全量提取 246 个令牌时逐条核对出来的，详见 lib/tokens.css。 */
  --dsw-alias-brand-primary-new-color:#4176e6;
  --dsw-alias-state-success-primary:var(--green-500);
  --dsw-alias-state-warn-primary:var(--amber-500);
  --dsw-alias-state-error-primary:var(--red-600);
  /* 用户气泡用客户端更深的蓝 600：白字压在品牌蓝 450 上只有 3.9:1，
     过不了正文 4.5:1 的门槛；#2563eb 是 5.2:1。品牌蓝留给强调与焦点。 */
  --bubble-user-fill:var(--blue-600);

  /* ── 页面内部短名 = 令牌别名 ── */
  --bg:var(--dsw-alias-bg-base);
  --panel:var(--dsw-alias-bg-layer-1);
  --panel2:var(--dsw-alias-bg-layer-2);
  --line:var(--dsw-alias-border-l1);
  --line2:var(--dsw-alias-border-l2);
  --fg:var(--dsw-alias-label-primary);
  --dim:var(--dsw-alias-label-secondary);
  --faint:var(--dsw-alias-label-tertiary);
  --accent:var(--dsw-alias-brand-primary-new-color);
  --accent-fg:#fff;
  --ok:var(--dsw-alias-state-success-primary);
  --warn:var(--dsw-alias-state-warn-primary);
  --bad:var(--dsw-alias-state-error-primary);
  --bubble-user:var(--bubble-user-fill);
  --bubble-ai:var(--dsw-alias-bg-layer-1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* 暗色：只有这一份。由 <head> 里的小脚本按系统偏好设 data-theme，手动切换覆盖它。 */
:root[data-theme='dark']{
  --dsw-alias-bg-base:var(--nb-950);
  --dsw-alias-bg-layer-1:var(--nb-875);
  --dsw-alias-bg-layer-2:var(--nb-850);
  --dsw-alias-bg-overlay:var(--nb-700);
  --dsw-alias-label-primary:var(--nb-50);
  --dsw-alias-label-secondary:var(--nb-300);
  --dsw-alias-label-tertiary:var(--nb-400);
  --dsw-alias-border-l1:#ffffff0f;
  --dsw-alias-border-l2:#ffffff1f;
  /* 包内暗色对品牌蓝有**真实覆盖** #5686fe（= --dsw-static-deepseek-450），
     不是我把亮色值搬过来的 —— 全量提取时核对过。 */
  --dsw-alias-brand-primary-new-color:#5686fe;
  --dsw-alias-state-error-primary:var(--red-400);
  --bubble-ai:var(--nb-850);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{color-scheme:light}
:root[data-theme='dark']{color-scheme:dark}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.6 var(--dsw-font-family);
  display:flex;flex-direction:column;overflow:hidden;
  /* 只关掉系统那层蓝色高亮蒙版；按压反馈由各组件自己的 :active 给，
     这样行为和桌面客户端一致，也不会在触屏上留下残留色块。 */
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea{font:inherit}

/* 按压反馈：80–150ms 内出现，且只改背景色 / 透明度，**不动布局尺寸** ——
   缩放或位移动画会把周围内容带得一起抖，是移动端廉价感的主要来源之一。 */
button{transition:background-color .12s ease-out,color .12s ease-out,opacity .12s ease-out}
button:disabled{cursor:default}

/* 键盘焦点必须看得见。用 :focus-visible 而不是 :focus，
   触屏点按就不会留下一个难看的光圈。 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--dsw-radius-sm)}
:focus:not(:focus-visible){outline:none}

/* 减小动效：不是可选项。前庭敏感的用户会被无限脉冲和旋转弄难受，
   所以这里把全部动画压成瞬变。 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ── 顶部 ───────────────────────────────────────────────────────────── */
header{
  flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:var(--safe-t);
}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 12px}
.sess{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  text-align:left;padding:2px 6px;border-radius:9px;
}
.sess:active{background:var(--panel2)}
.sess .t{font-size:14.5px;font-weight:600;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .s{font-size:11.5px;color:var(--faint)}
/* 触碰区 ≥44×44 —— iOS/Android 的硬性下限，检索库里标为 Critical。
   图标本身 20px，靠按钮本身撑到 44；相邻按钮之间留够间距。 */
.iconbtn{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--dsw-radius-md);
  display:grid;place-items:center;color:var(--dim);
}
.iconbtn:active{background:var(--panel2);color:var(--fg)}
.iconbtn svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed='true']{color:var(--accent)}

/* 状态条：一句话说清现在什么情况 */
#status{
  display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:9px 12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  font-size:13.5px;color:var(--dim);text-align:left;width:calc(100% - 24px);
}
#status .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
#status.busy .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
#status.warn .dot{background:var(--warn)}
#status.bad .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#status .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status .chev{flex:0 0 auto;color:var(--faint);font-size:12px}

/* ── 消息区 ─────────────────────────────────────────────────────────── */
main{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:14px 12px 6px;
  display:flex;flex-direction:column;gap:10px;
}
.row{display:flex;flex-direction:column;max-width:100%}
.row.me{align-items:flex-end}
.row.ai{align-items:flex-start}
/* 气泡外面包一层 .bubwrap：折叠按钮必须待在 max-height 之外，
   否则会被 overflow:hidden 一起裁掉，点都点不到。 */
.bubwrap{max-width:84%;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.me .bubwrap{align-items:flex-end}
.bub{
  max-width:100%;padding:10px 13px;border-radius:var(--dsw-radius-lg);white-space:pre-wrap;
  word-break:break-word;font-size:15.5px;overflow-wrap:anywhere;
}
.me .bub{background:var(--bubble-user);color:var(--accent-fg);border-bottom-right-radius:var(--dsw-radius-xs)}
.ai .bub{background:var(--bubble-ai);border:1px solid var(--line);border-bottom-left-radius:var(--dsw-radius-xs)}
.meta{font-size:11px;color:var(--faint);margin:3px 4px 0}

/* 工具卡片：把内部工具名翻成人话，这是"看得懂进度"的关键 */
.tool{
  max-width:90%;margin-top:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;font-size:13.5px;
}
.tool .h{display:flex;align-items:center;gap:8px}
.tool .h .n{font-weight:600}
.tool .h .st{margin-left:auto;font-size:12px;color:var(--faint);flex:0 0 auto}
.tool.run{border-color:rgba(76,141,255,.5)}
.tool.run .sp{
  flex:0 0 auto;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(76,141,255,.3);
  border-top-color:var(--accent);animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.tool.ok .h .st{color:var(--ok)}
.tool.no .h .st{color:var(--bad)}
/* 状态图标：同一套描边风格、同一个尺寸令牌，filled/outline 不混用。 */
.tool .ti{flex:0 0 auto;display:grid;place-items:center;color:var(--ok)}
.tool.no .ti{color:var(--bad)}
.tool .ti svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .a{margin-top:4px;color:var(--dim);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 空状态：第一眼必须知道"这是干什么的" */
.empty{margin:auto 0;padding:20px 6px;text-align:center}
.empty h2{margin:0 0 8px;font-size:19px}
.empty p{margin:0 0 18px;color:var(--dim);font-size:14.5px;line-height:1.65}
.chips{display:flex;flex-direction:column;gap:9px}
.chip{
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;font-size:15px;text-align:left;
}
.chip:active{background:var(--panel2)}

.note{font-size:12.5px;color:var(--faint);text-align:center;padding:6px 16px}

/* ── 输入区 ─────────────────────────────────────────────────────────── */
footer{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + var(--safe-b));
}
.composer{display:flex;align-items:flex-end;gap:9px}
#input{
  flex:1;min-height:44px;max-height:132px;resize:none;overflow-y:auto;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;font-size:16px;line-height:1.5;
}
#input:focus{outline:none;border-color:rgba(76,141,255,.55)}
#send{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--dsw-radius-md);background:var(--accent);
  color:var(--accent-fg);display:grid;place-items:center;
}
/* SVG 必须显式给尺寸：不给的话浏览器按 300×150 的默认替换尺寸渲染，按钮会被撑爆。 */
#send svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#send:active{opacity:.85}
#send:disabled{opacity:.4}
#send.stop{background:var(--bad)}

/* ── 抽屉 ───────────────────────────────────────────────────────────── */
#sheet{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;
}
#sheet[hidden]{display:none}
.card{
  width:100%;max-height:82vh;overflow-y:auto;background:var(--panel);
  border-radius:18px 18px 0 0;padding:8px 0 calc(12px + var(--safe-b));
  border-top:1px solid var(--line);
}
.card .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 10px}
.card h3{margin:6px 16px 8px;font-size:13px;color:var(--faint);font-weight:600;letter-spacing:.03em}
.item{
  display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;
  text-align:left;width:100%;
}
.item:active{background:var(--panel2)}
.item .g{flex:1;min-width:0}
.item .g .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .g .s{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .r{flex:0 0 auto;font-size:12px;color:var(--faint)}
.item.on .g .t{color:var(--accent);font-weight:600}
.kv{display:flex;gap:10px;padding:9px 16px;font-size:14px;border-top:1px solid var(--line)}
.kv .k{flex:0 0 88px;color:var(--dim)}
.kv .v{flex:1;min-width:0;word-break:break-word}
.pill{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin:0 16px 8px;font-size:15px;width:calc(100% - 32px);text-align:left}
.pill:active{background:var(--panel2)}

/* ══ 溢出与折叠（内容放不下时的八条策略） ══════════════════════════════
   原则：**任何长内容都不许撑破布局，但也不许无声无息地被截掉** ——
   要么折叠后能展开，要么给一个自己会滚的容器，要么给复制按钮。
   ══════════════════════════════════════════════════════════════════ */

/* 1. 超长回复：折叠 + 底部渐隐。折叠与否按字符数预判，不等布局算完再改，
      否则会先闪一下全文再收起来。 */
.bub.fold{max-height:22rem;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 44px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 44px),transparent)}
.bub.fold.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.foldbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  min-height:44px;margin-top:2px;color:var(--accent);font-size:13.5px;
  font-weight:500;border-radius:var(--dsw-radius-sm)}
.foldbtn:active{background:var(--panel2)}
.foldbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease-out}
.foldbtn[aria-expanded='true'] svg{transform:rotate(180deg)}

/* 2. 代码块：内部自己横竖滚，绝不撑破气泡；右上角可复制。 */
.code{margin:4px 0;border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  overflow:hidden;background:var(--panel2)}
.codebar{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;
  border-bottom:1px solid var(--line);font-size:12px;color:var(--faint)}
.codebar .lang{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codebar button{display:flex;align-items:center;gap:5px;min-height:36px;padding:0 8px;
  color:var(--dim);border-radius:var(--dsw-radius-sm);font-size:12px}
.codebar button:active{background:var(--panel)}
.codebar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.code pre{margin:0;padding:10px 12px;max-height:20rem;overflow:auto;
  font:12.5px/1.6 var(--dsw-font-mono);color:var(--fg);white-space:pre;
  -webkit-overflow-scrolling:touch}

/* 3. 工具卡里的长命令：原来是单行省略号，长命令等于看不见。
      改成默认收 3 行、点开看全、并给复制按钮。 */
.tool .a{white-space:pre-wrap;overflow-wrap:anywhere;max-height:4.2rem;overflow:hidden}
.tool .a.open{max-height:none}
.tool .a code{font:12.5px/1.6 var(--dsw-font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.tool .acts{display:flex;align-items:center;gap:18px;margin-top:2px}
.tool .more{min-height:32px;color:var(--accent);font-size:12.5px;
  display:flex;align-items:center;gap:5px}
.tool .more:active{opacity:.7}

/* 4. 流式输出中：尾部渐隐，表示"还在往下长"（客户端也是用 mask-image 做的）。 */
.bub.streaming{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 20px),transparent)}

/* 5. 回到底部：离开底部才出现，并显示期间来了几条新消息。 */
#tobottom{position:fixed;right:14px;bottom:calc(78px + var(--safe-b));z-index:30;
  display:none;align-items:center;gap:6px;min-height:44px;padding:0 14px;
  border-radius:999px;background:var(--panel);border:1px solid var(--line2);
  color:var(--fg);font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tobottom.on{display:flex}
#tobottom svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
#tobottom .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--accent);color:var(--accent-fg);font-size:11.5px;
  display:grid;place-items:center}
#tobottom .n[hidden]{display:none}

/* 6. 全页禁止横向滚动：长 URL / 宽表格 / 长代码都不许把页面顶宽。 */
html,body{overflow-x:clip}
.bub,.tool,.code pre{overflow-wrap:anywhere}

/* 7. 连续多个工具调用折叠成一行「N 个步骤」。
      这一条是"内容放不下"里最占地方的：一个回合常常十几步，每步一张卡，
      几十条下来把对话整个冲掉。折叠后一行讲清「几步、什么状态」，
      点开才逐条看。运行中默认展开（要看得见进度），全部结束自动收起来。 */
.toolgroup{width:100%;min-width:0;border:1px solid var(--line);
  border-radius:var(--dsw-radius-md);background:var(--panel2);overflow:hidden}
.toolgroup .gh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;
  padding:0 12px;text-align:left;color:var(--dim);font-size:13.5px}
.toolgroup .gh:active{background:var(--panel)}
.toolgroup .gh .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolgroup .gh .sum b{color:var(--fg);font-weight:600}
.toolgroup .gh .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.toolgroup.busy .gh .dot{background:var(--warn)}
.toolgroup.bad .gh .dot{background:var(--bad)}
.toolgroup .gh svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease-out}
.toolgroup .gh svg.ch{transition:transform .15s ease-out}
.toolgroup .gh[aria-expanded='true'] svg.ch{transform:rotate(180deg)}
.toolgroup .gb{padding:0 8px 8px}
.toolgroup .gb .tool{margin-top:6px}
.toolgroup .gb[hidden]{display:none}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button id="sessBtn" class="sess" aria-label="切换会话">
      <span class="t" id="sessTitle">连接中…</span>
      <span class="s" id="sessSub">正在连接</span>
    </button>
    <button id="themeBtn" class="iconbtn" aria-label="切换深浅色" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button id="menuBtn" class="iconbtn" aria-label="打开菜单">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <button id="status" aria-label="查看任务详情" aria-expanded="false">
    <span class="dot" aria-hidden="true"></span>
    <span class="txt" id="statusTxt">正在连接…</span>
    <span class="chev" aria-hidden="true">详情</span>
  </button>
</header>

<main id="log" role="log" aria-live="polite" aria-label="对话记录"></main>

<!-- 回到底部：离开底部时才出现，并显示期间来了几条新消息。 -->
<button id="tobottom" type="button" aria-label="回到最新消息">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  <span>最新</span>
  <span class="n" hidden></span>
</button>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"
      aria-label="输入消息" enterkeyhint="send"></textarea>
    <button id="send" aria-label="发送">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 6l6 6-6 6"/></svg>
    </button>
  </div>
</footer>

<!-- 抽屉按对话框语义标注：读屏会当成模态处理，焦点不会跑到后面的对话里。 -->
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="任务与会话">
  <div class="card" id="card"></div>
</div>

<script>
'use strict';
// ===========================================================================
// 手机对话页 —— 与宿主 /taskwatch/chat/* 路由配套。
//
// 宿主侧只是把 DSH 自己的 sessionController 转出来，LLM 与流式协议都不在本插件里，
// 所以这里也不需要任何模型概念：只认 wire 帧。
//
// 帧有三类：
//   snapshot         开场快照（含最近 N 条历史）
//   event            增量事件（user/message、assistant/message、tool/call、tool/result、
//                    turn/start、turn/end）
//   assistant-stream 逐字增量（frame.chunk.type === 'text-delta'）
// ===========================================================================

var $ = function(id){ return document.getElementById(id) }
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ESC[c] })
}
function hhmm(t){
  var d = t ? new Date(t) : new Date()
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)
}
function shortId(id){ id = String(id||''); return id.length > 12 ? id.slice(0,8)+'…' : id }

// 工具名 → 人话。表里没有就显示原名，不隐藏、不猜。
var TOOL = {
  pwsh:'运行命令', read:'读取文件', write:'写入文件', edit:'修改文件',
  glob:'查找文件', grep:'搜索内容', web_search:'联网搜索', web_fetch:'打开网页',
  subagent:'派发子任务', subagent_fork:'派发子任务', todo_write:'更新任务清单',
  skill:'加载技能', job_output:'读取后台任务', job_kill:'结束后台任务',
  job_list:'查看后台任务', create_goal:'建立目标', update_goal:'更新目标',
  present:'交付文件', ask_user_question:'向你提问', read_image:'看图',
  cordis_define:'定义插件', cordis_run:'启动插件', cordis_inspect_self:'检查插件',
  workflow:'运行工作流', ralph:'运行迭代循环'
}
function toolLabel(name){ return TOOL[name] || name || '操作' }

// 从工具参数里挑一个最能说明"在干嘛"的片段。
function argHint(raw){
  var s = String(raw || '')
  if (!s) return ''
  try {
    var o = JSON.parse(s)
    if (o && typeof o === 'object') {
      var keys = ['command','file_path','path','pattern','query','url','prompt','description','id','name']
      for (var i = 0; i < keys.length; i++) {
        var v = o[keys[i]]
        if (typeof v === 'string' && v) return v.replace(/\s+/g,' ').slice(0, 160)
      }
      var ks = Object.keys(o)
      if (ks.length && typeof o[ks[0]] === 'string') return o[ks[0]].replace(/\s+/g,' ').slice(0, 160)
    }
  } catch (e) { /* 不是 JSON：按原文截断 */ }
  return s.replace(/\s+/g,' ').slice(0, 160)
}

// 只认 text 块；其它类型不硬塞成文字。
function blocksText(blocks){
  var out = ''
  if (!Array.isArray(blocks)) return out
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i]
    if (b && b.type === 'text' && typeof b.text === 'string') out += (out ? '\n' : '') + b.text
  }
  return out
}

// ---------------------------------------------------------------------------
// 状态
// ---------------------------------------------------------------------------
var S = {
  sessionId: '',
  title: '',
  sessions: [],
  items: [],
  seq: 0,
  running: false,
  es: null,
  streaming: null,
  pending: null,
  chatReady: true
}

// 冷会话标题缓存。
//
// 宿主侧 SessionSummary **没有** title 字段，所以列表里冷会话只能退化成目录名
// （实测 60 条全叫 "Projects"，完全没法挑）。真标题要从事件日志里取一次
// （/taskwatch/chat/titles）。结果缓存在本机 localStorage：
// 只有第一次打开列表会慢一下，之后直接命中。
var titles = {}
try { titles = JSON.parse(localStorage.getItem('taskwatch.titles') || '{}') || {} } catch (e) { titles = {} }

// ---------------------------------------------------------------------------
// 归一化
// ---------------------------------------------------------------------------
function normUser(d){
  // 工具结果同样是 role:'user'，但它不是"人说的话"，必须挡掉。
  if (d && d.source && d.source.kind === 'tool') return null
  var text = blocksText(d && d.content)
  if (!text) return null
  return { kind:'user', text:text }
}
function normAssistant(d){
  var m = d && d.message
  var text = blocksText(m && m.content)
  if (!text) return null
  return { kind:'assistant', text:text, interrupted: !!(d && d.interrupted) }
}
function toolItem(name, args, callId, status){
  return { kind:'tool', callId:String(callId||''), name:name||'', hint:argHint(args), status:status }
}
// tool/result 的 callId 在 data.message.source.callId —— **不在顶层**。
// 2026-09-22 实测踩过：按顶层 d.callId 读会拿到 undefined，于是每来一个工具结果
// 都会新插一张错卡，而不是把原来那张改成「完成」。这类错误静态检查看不见，
// 只有真跑一轮带工具调用的对话才会暴露。
function resultCallId(d){
  if (!d) return ''
  if (d.message && d.message.source && d.message.source.callId) return String(d.message.source.callId)
  var c = d.message && Array.isArray(d.message.content) ? d.message.content : null
  if (c && c[0] && c[0].toolCallId) return String(c[0].toolCallId)
  return ''
}
function markTool(callId, failed){
  var id = String(callId||'')
  for (var i = S.items.length - 1; i >= 0; i--) {
    if (S.items[i].kind === 'tool' && S.items[i].callId === id) {
      S.items[i].status = failed ? 'no' : 'ok'
      return i
    }
  }
  S.items.push(toolItem('', '', id, failed ? 'no' : 'ok'))
  return S.items.length - 1
}

function acceptEvent(ev){
  if (!ev || typeof ev !== 'object') return
  var t = ev.type, d = ev.data
  if (typeof ev.seq === 'number' && ev.seq > S.seq) S.seq = ev.seq
  if (t === 'user/message') {
    var u = normUser(d)
    if (u) { S.items.push(u); dropPending(); renderAt(S.items.length - 1) }
  } else if (t === 'assistant/message') {
    var a = normAssistant(d)
    // 顺序很重要：先落进 S.items，再收流式气泡。反过来 finishStreaming() 会以为
    // 服务端没给正式消息而补一条，同一段话于是建两条。
    if (a) S.items.push(a)
    finishStreaming()
    if (a) renderAt(S.items.length - 1)
  } else if (t === 'tool/call') {
    S.items.push(toolItem(d && d.name, d && d.arguments, d && d.callId, 'run'))
    renderAt(S.items.length - 1)
  } else if (t === 'tool/result') {
    renderAt(markTool(resultCallId(d), !!(d && d.error)))
  } else if (t === 'session/title') {
    setTitle(d && d.title)
  } else if (t === 'turn/start') {
    S.running = true; syncSend()
  } else if (t === 'turn/end') {
    S.running = false; finishStreaming(); syncSend()
  }
}

function applySnapshot(f){
  S.items = []
  S.seq = typeof f.cursor === 'number' ? f.cursor : 0
  var recs = Array.isArray(f.records) ? f.records : []
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i]
    if (!r || r.type !== 'event' || !r.event) continue
    var ev = r.event, d = ev.data
    if (typeof ev.seq === 'number' && ev.seq > S.seq) S.seq = ev.seq
    if (ev.type === 'user/message') { var u = normUser(d); if (u) S.items.push(u) }
    else if (ev.type === 'assistant/message') { var a = normAssistant(d); if (a) S.items.push(a) }
    else if (ev.type === 'tool/call') S.items.push(toolItem(d && d.name, d && d.arguments, d && d.callId, 'run'))
    else if (ev.type === 'tool/result') markTool(resultCallId(d), !!(d && d.error))
    else if (ev.type === 'session/title') pendingTitle = d && d.title
    else if (ev.type === 'turn/start') S.running = true
    else if (ev.type === 'turn/end') S.running = false
  }
  S.pending = null
  S.streaming = null
  renderAll()
  if (pendingTitle) setTitle(pendingTitle)
  pendingTitle = ''
  syncSend()
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------
var log = $('log')
var pendingTitle = ''

function nearBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 90 }
function toBottom(){ log.scrollTop = log.scrollHeight }

// ── 回到底部 ──────────────────────────────────────────────────────────────
// 长对话被冲到下面之后，必须有个东西能一键回到最新，并告诉用户期间来了几条。
// 这里的 scroll 监听是 **passive + requestAnimationFrame 节流** 的：每次滚动
// 最多做一次布尔判断，既不读也不写布局，所以不会拖慢滚动。
var unseen = 0
var tbTick = 0
function tbEl(){ return document.getElementById('tobottom') }
function syncUnseen(){
  var b = tbEl(); if (!b) return
  var n = b.querySelector('.n'); if (!n) return
  if (unseen > 0) { n.hidden = false; n.textContent = unseen > 99 ? '99+' : String(unseen) }
  else n.hidden = true
}
function syncToBottom(){
  var b = tbEl(); if (!b) return
  if (nearBottom()) { b.classList.remove('on'); unseen = 0; syncUnseen() }
  else b.classList.add('on')
}
/** 有新内容落进日志时调用：没贴在底部就累计未读，并让按钮浮出来。 */
function noteIncoming(){
  if (!nearBottom()) { unseen++; syncUnseen() }
  syncToBottom()
}
log.addEventListener('scroll', function(){
  if (tbTick) return
  tbTick = requestAnimationFrame(function(){ tbTick = 0; syncToBottom() })
}, { passive:true })
if (tbEl()) tbEl().addEventListener('click', function(){ toBottom(); unseen = 0; syncUnseen(); syncToBottom() })
function rowNode(cls){ var r = document.createElement('div'); r.className = 'row ' + cls; return r }
/** 复制到剪贴板。navigator.clipboard 在非 HTTPS 或旧 WebView 里可能不存在，
 *  所以留一条 execCommand 的老路；两条都失败就明说"复制失败"，不假装成功。 */
function copyText(s, btn){
  function done(ok){
    if (!btn) return
    var old = btn.getAttribute('data-label') || btn.textContent
    btn.setAttribute('data-label', old)
    btn.textContent = ok ? '已复制' : '复制失败'
    setTimeout(function(){ btn.textContent = old }, 1500)
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function(){ done(true) }, function(){ done(false) })
      return
    }
  } catch (e) {}
  try {
    var ta = document.createElement('textarea')
    ta.value = s; ta.setAttribute('readonly','')
    ta.style.position = 'fixed'; ta.style.top = '-1000px'
    document.body.appendChild(ta); ta.select()
    var ok = document.execCommand('copy')
    document.body.removeChild(ta); done(ok)
  } catch (e) { done(false) }
}

/** 代码块：``` 围栏之间的内容，放进一个自己会横竖滚的 <pre>，头上一行可复制。
 *  内容依旧走 textContent —— "模型文本绝不进 innerHTML" 这条铁律不变。 */
function codeNode(lang, body){
  var box = document.createElement('div'); box.className = 'code'
  var bar = document.createElement('div'); bar.className = 'codebar'
  var lg = document.createElement('span'); lg.className = 'lang'
  lg.textContent = lang || '代码'
  var cp = document.createElement('button')
  cp.type = 'button'; cp.setAttribute('aria-label','复制这段代码')
  cp.textContent = '复制'
  cp.addEventListener('click', function(){ copyText(body, cp) })
  bar.appendChild(lg); bar.appendChild(cp)
  var pre = document.createElement('pre'); pre.textContent = body
  box.appendChild(bar); box.appendChild(pre)
  return box
}

/** 折叠按钮：默认收起，点开看全文。aria-expanded 让读屏知道当前状态。 */
function foldBtn(bub, chars){
  var btn = document.createElement('button')
  btn.type = 'button'
  btn.className = 'foldbtn'
  btn.setAttribute('aria-expanded','false')
  btn.innerHTML = ICON_CHEV          // 文件内常量，非模型文本
  btn.appendChild(document.createTextNode('展开全文（约 ' + chars + ' 字）'))
  btn.addEventListener('click', function(){
    var open = bub.classList.toggle('open')
    btn.setAttribute('aria-expanded', open ? 'true' : 'false')
    btn.lastChild.nodeValue = open ? '收起' : ('展开全文（约 ' + chars + ' 字）')
  })
  return btn
}

var FOLD_CHARS = 620

/** 气泡。返回的是 .bubwrap 包裹层（里面才是 .bub），这样折叠按钮不会被
 *  max-height 一起裁掉。
 *
 *  两种渲染：
 *   - 不含 ``` 围栏：整段一个文本节点。流式期间只改 textContent，代价最低。
 *   - 含围栏：拆成「文字 · 代码块 · 文字」，代码块自己会滚，不用把页面顶宽。 */
function bubNode(text){
  var wrap = document.createElement('div'); wrap.className = 'bubwrap'
  var b = document.createElement('div')
  b.className = 'bub'
  var s = String(text == null ? '' : text)
  var parts = s.split('```')
  if (parts.length > 1) {
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        if (parts[i]) b.appendChild(document.createTextNode(parts[i]))
      } else {
        var seg = parts[i]
        var nl = seg.indexOf('\n')
        var lang = nl >= 0 ? seg.slice(0, nl).trim() : ''
        var body = nl >= 0 ? seg.slice(nl + 1) : seg
        b.appendChild(codeNode(lang, body.replace(/\n+$/, '')))
      }
    }
  } else {
    b.textContent = s
  }
  wrap.appendChild(b)
  if (s.length > FOLD_CHARS) {
    b.classList.add('fold')
    wrap.appendChild(foldBtn(b, s.length))
  }
  return wrap
}
function toolNode(it){
  var d = document.createElement('div')
  d.className = 'tool ' + (it.status === 'run' ? 'run' : it.status === 'no' ? 'no' : 'ok')
  var head = document.createElement('div')
  head.className = 'h'
  if (it.status === 'run') {
    var sp = document.createElement('span'); sp.className = 'sp'; head.appendChild(sp)
  } else {
    // 状态图标同样用 SVG —— 字符 ✓ ✕ 在不同字体下粗细和垂直位置都不一样。
    var ic = document.createElement('span')
    ic.className = 'ti'
    ic.innerHTML = (it.status === 'no' ? ICON_FAIL : ICON_OK)  // 文件内常量，非模型文本
    head.appendChild(ic)
  }
  var nm = document.createElement('span'); nm.className = 'n'; nm.textContent = toolLabel(it.name)
  head.appendChild(nm)
  var st = document.createElement('span'); st.className = 'st'
  st.textContent = it.status === 'run' ? '进行中' : (it.status === 'no' ? '失败' : '完成')
  head.appendChild(st)
  d.appendChild(head)
  if (it.hint) {
    var a = document.createElement('div'); a.className = 'a'
    var codeEl = document.createElement('code'); codeEl.textContent = it.hint
    a.appendChild(codeEl)
    d.appendChild(a)
    // 长命令默认只露三行 —— 给「展开」和「复制」，而不是无声无息截成省略号。
    var acts = document.createElement('div'); acts.className = 'acts'
    if (it.hint.length > 120 || it.hint.indexOf('\n') >= 0) {
      var more = document.createElement('button')
      more.type = 'button'; more.className = 'more'
      more.setAttribute('aria-expanded','false')
      more.textContent = '展开完整内容'
      more.addEventListener('click', function(){
        var open = a.classList.toggle('open')
        more.setAttribute('aria-expanded', open ? 'true' : 'false')
        more.textContent = open ? '收起' : '展开完整内容'
      })
      acts.appendChild(more)
    }
    var cp = document.createElement('button')
    cp.type = 'button'; cp.className = 'more'
    cp.setAttribute('aria-label','复制这条命令')
    cp.textContent = '复制'
    cp.addEventListener('click', function(){ copyText(it.hint, cp) })
    acts.appendChild(cp)
    d.appendChild(acts)
  }
  return d
}
/** 连续工具调用的分组阈值：连续 ≥3 个才收成一组，1~2 个直接平铺（收起反而多一次点击）。 */
var TOOL_GROUP_MIN = 3

/** 取 idx 所在的"连续工具段"。返回 null 表示这段不够长、不该分组。 */
function toolRunAt(idx){
  if (idx < 0 || idx >= S.items.length || S.items[idx].kind !== 'tool') return null
  var start = idx, end = idx
  while (start > 0 && S.items[start - 1].kind === 'tool') start--
  while (end + 1 < S.items.length && S.items[end + 1].kind === 'tool') end++
  if (end - start + 1 < TOOL_GROUP_MIN) return null
  return { start: start, end: end }
}

/** 把一段连续工具调用收成一行摘要。
 *
 *  默认展开还是收起，按状态定（这是"小白也看得懂"的关键，不是装饰）：
 *    有步骤在跑 → 默认展开，看得见进度
 *    有失败      → 默认展开，**失败绝不能被折叠藏起来**
 *    全部完成    → 默认收起成一行，把屏幕让给对话
 */
function groupNode(run){
  var items = S.items.slice(run.start, run.end + 1)
  var running = 0, failed = 0
  for (var i = 0; i < items.length; i++) {
    if (items[i].status === 'run') running++
    else if (items[i].status === 'no') failed++
  }
  var opened = running > 0 || failed > 0

  var box = document.createElement('div')
  box.className = 'toolgroup' + (running ? ' busy' : failed ? ' bad' : '')

  var head = document.createElement('button')
  head.type = 'button'
  head.className = 'gh'
  head.setAttribute('aria-expanded', opened ? 'true' : 'false')

  var dot = document.createElement('span'); dot.className = 'dot'
  head.appendChild(dot)

  var sum = document.createElement('span'); sum.className = 'sum'
  var strong = document.createElement('b'); strong.textContent = items.length + ' 个步骤'
  sum.appendChild(strong)
  sum.appendChild(document.createTextNode(
    running ? ' · ' + running + ' 项进行中'
      : failed ? ' · ' + failed + ' 项失败'
        : ' · 全部完成'))
  head.appendChild(sum)

  var ch = document.createElement('span')
  ch.innerHTML = ICON_CHEV                       // 文件内常量，非模型文本
  var csvg = ch.firstChild
  if (csvg && csvg.setAttribute) csvg.setAttribute('class', 'ch')
  head.appendChild(ch)

  var body = document.createElement('div')
  body.className = 'gb'
  for (var k = 0; k < items.length; k++) body.appendChild(toolNode(items[k]))
  body.hidden = !opened

  head.addEventListener('click', function () {
    var collapsing = !body.hidden
    body.hidden = collapsing
    head.setAttribute('aria-expanded', collapsing ? 'false' : 'true')
  })

  box.appendChild(head)
  box.appendChild(body)
  return box
}

function nodeFor(it, idx){
  var r = rowNode(it.kind === 'user' ? 'me' : 'ai')
  r.setAttribute('data-i', String(idx))
  if (it.kind === 'tool') { r.appendChild(toolNode(it)); return r }
  r.appendChild(bubNode(it.text))
  var m = document.createElement('div')
  m.className = 'meta'
  m.textContent = it.kind === 'user' ? '你' : (it.interrupted ? '助手 · 已中断' : '助手')
  r.appendChild(m)
  return r
}

/** 分组外面那层 .row：data-i 用这一段工具的**起点**（增量更新靠它定位），
 *  另挂一个 data-g 标记"这是一行分组"，好和单条工具卡区分开。 */
function groupRow(run){
  var r = rowNode('ai')
  r.setAttribute('data-i', String(run.start))
  r.setAttribute('data-g', String(run.start))
  r.appendChild(groupNode(run))
  return r
}

/** 全量重建：只在开场快照时用。 */
function renderAll(){
  log.innerHTML = ''
  if (!S.items.length && S.chatReady) { renderEmpty(); return }
  var frag = document.createDocumentFragment()
  for (var i = 0; i < S.items.length; i++) {
    if (S.items[i].kind === 'tool') {
      var run = toolRunAt(i)
      if (run) {
        frag.appendChild(groupRow(run))
        i = run.end                 // 这一段已经收进分组，跳过剩下的
        continue
      }
    }
    frag.appendChild(nodeFor(S.items[i], i))
  }
  log.appendChild(frag)
  renderPending()
  toBottom()
}

/** 增量：按序号**就地替换**那一条。
 *
 *  S.items 只可能"尾部追加"或"原地改状态"（工具结果会把对应那张卡从进行中改成
 *  完成），所以序号是稳定的 —— 用 data-i 定位旧节点替换即可。
 *  早先的版本靠"最后一张卡的标签是否相同"来判断该替换哪张，脆弱且会插错；
 *  实测一次带工具调用的对话就能看出来，所以改成了按序号。
 */
function renderAt(idx){
  if (idx < 0 || idx >= S.items.length) return
  if (log.querySelector('.empty')) log.innerHTML = ''
  var stick = nearBottom()

  // 工具条目可能属于一个分组：那时要整段重建，而不是只换这一条。
  var run = S.items[idx].kind === 'tool' ? toolRunAt(idx) : null
  if (run) {
    var head = log.querySelector('.row[data-g="' + run.start + '"]')
    if (head) {
      head.replaceWith(groupRow(run))
    } else {
      // 这一段里可能已经单独渲染过几行（刚够格成组的那一刻），先清掉再插入 ——
      // 否则会出现「分组 + 残留旧行」同时挂在页面上，同一批步骤显示两遍。
      for (var j = run.start; j <= run.end; j++) {
        var stray = log.querySelector('.row[data-i="' + j + '"]')
        if (stray && !stray.getAttribute('data-g')) stray.remove()
      }
      var after = log.querySelector('.row[data-i="' + (run.end + 1) + '"]')
      var row = groupRow(run)
      if (after) log.insertBefore(row, after)
      else { log.appendChild(row); noteIncoming() }
    }
    renderPending()
    if (stick) toBottom()
    return
  }

  var n = nodeFor(S.items[idx], idx)
  var old = log.querySelector('[data-i="' + idx + '"]')
  if (old) old.replaceWith(n)
  else { log.appendChild(n); noteIncoming() }
  renderPending()
  if (stick) toBottom()
}

function renderEmpty(){
  log.innerHTML = ''
  var d = document.createElement('div')
  d.className = 'empty'
  var h2 = document.createElement('h2'); h2.textContent = '在这里跟我说话就行'
  var p = document.createElement('p')
  p.innerHTML = '我会在这台电脑上干活，进度直接显示在这里。<br>想看还有几个任务在跑，点上面的状态条。'
  d.appendChild(h2); d.appendChild(p)
  var box = document.createElement('div'); box.className = 'chips'
  var says = ['现在什么情况？', '还有几个任务在跑？', '帮我看一下有没有卡住的地方']
  for (var i = 0; i < says.length; i++) {
    var c = document.createElement('button')
    c.className = 'chip'
    c.textContent = says[i]
    c.setAttribute('data-say', says[i])
    box.appendChild(c)
  }
  d.appendChild(box)
  log.appendChild(d)
  var cs = d.querySelectorAll('.chip')
  for (var k = 0; k < cs.length; k++) {
    cs[k].addEventListener('click', function(){ send(this.getAttribute('data-say')) })
  }
}

/** 已发出但还没落进日志的气泡：让"点了发送"立刻有反馈。 */
function renderPending(){
  var old = log.querySelector('.row.pending')
  if (old) old.remove()
  if (!S.pending) return
  var r = rowNode('me')
  r.classList.add('pending')
  r.appendChild(bubNode(S.pending))
  var m = document.createElement('div')
  m.className = 'meta'
  m.textContent = '发送中…'
  r.appendChild(m)
  log.appendChild(r)
  toBottom()
}
function dropPending(){
  if (!S.pending) return
  S.pending = null
  var old = log.querySelector('.row.pending')
  if (old) old.remove()
}

/** 逐字输出：只改一个节点的文本，绝不整页重建。 */
function streamText(txt){
  if (!S.streaming) {
    var r = rowNode('ai')
    var w = bubNode('')
    r.appendChild(w)
    log.appendChild(r)
    var b = w.querySelector('.bub') || w
    b.classList.add('streaming')     // 尾部渐隐，表示"还在往下长"
    S.streaming = { row:r, bub:b, text:'' }
    noteIncoming()
  }
  S.streaming.text += txt
  S.streaming.bub.textContent = S.streaming.text
  if (nearBottom()) toBottom()
}

/** 流式收尾：**必须把临时气泡从页面上拿掉**。
 *
 *  早先的版本只把 S.streaming 置空、不删节点，而最终文本随后又会由
 *  assistant/message 作为正式条目重新渲染 —— 同一段话于是在页面上显示两遍。
 *  如果服务端始终没给正式消息（只有增量就 turn/end 了），这里补一条，
 *  免得文本凭空消失。
 */
function finishStreaming(){
  if (!S.streaming) return
  var t = S.streaming.text
  try { if (S.streaming.row && S.streaming.row.parentNode) S.streaming.row.remove() } catch (e) {}
  S.streaming = null
  if (!t) return
  var last = S.items.length ? S.items[S.items.length - 1] : null
  if (last && last.kind === 'assistant' && last.text === t) return
  S.items.push({ kind:'assistant', text:t, interrupted:false })
  renderAt(S.items.length - 1)
}

// ---------------------------------------------------------------------------
// 流式连接
// ---------------------------------------------------------------------------
var SEQ = 0
function openStream(){
  if (S.es) { try { S.es.close() } catch (e) {} S.es = null }
  if (!S.sessionId) return
  var mine = ++SEQ
  setSub('连接中…')
  var es = new EventSource('/taskwatch/chat/stream?sessionId=' + encodeURIComponent(S.sessionId))
  S.es = es
  es.onopen = function(){ if (mine === SEQ) setSub('') }
  es.onmessage = function(msg){
    if (mine !== SEQ) return          // 切会话后的旧连接，直接丢弃
    var f
    try { f = JSON.parse(msg.data) } catch (e) { return }
    if (!f) return
    if (f.type === 'snapshot') { applySnapshot(f); setSub(''); return }
    if (f.type === 'event') { acceptEvent(f.event); return }
    if (f.type === 'assistant-stream') {
      var fr = f.frame
      if (fr && fr.type === 'start') { S.running = true; syncSend() }
      else if (fr && fr.type === 'end') { finishStreaming() }
      else if (fr && fr.type === 'chunk' && fr.chunk
               && fr.chunk.type === 'text-delta' && typeof fr.chunk.text === 'string') {
        streamText(fr.chunk.text)
        if (!S.running) { S.running = true; syncSend() }
      }
      return
    }
    if (f.type === 'taskwatch-error') { setSub('出错：' + (f.message || '')); return }
  }
  es.onerror = function(){
    if (mine !== SEQ) return
    setSub('连接中断，重连中…')   // EventSource 自带重连，不主动再开一条
  }
}

// ---------------------------------------------------------------------------
// 交互
// ---------------------------------------------------------------------------
// 图标一律用内联 SVG，不用 ➤ ■ 这类字符：字符图标在不同字体下大小与基线都不同，
// 换台设备就变形，也没法用令牌统一控制粗细和颜色。
// 下面两个字符串是**文件内常量**，不含任何宿主或模型来的内容，所以这里用 innerHTML 安全。
var ICON_SEND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 6l6 6-6 6"/></svg>'
var ICON_STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
// 工具卡的状态图标。定义在本行、用在上面的 toolNode() 里 —— var 声明会提升，
// 而 toolNode() 是在脚本顶层跑完之后才被调用的，所以顺序没问题。
var ICON_OK   = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>'
var ICON_FAIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>'
var ICON_CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
var ICON_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>'
function syncSend(){
  var b = $('send')
  if (S.running) { b.innerHTML = ICON_STOP; b.classList.add('stop'); b.setAttribute('aria-label','停止') }
  else { b.innerHTML = ICON_SEND; b.classList.remove('stop'); b.setAttribute('aria-label','发送') }
}
function setSub(t){ $('sessSub').textContent = t || '' }
// 会话标题。开场快照和后续事件里都会带 session/title 帧，
// 所以冷会话一旦被选中，顶部立刻能显示真名（不必等它变热）。
function setTitle(t){
  if (!t) return
  S.title = String(t)
  $('sessTitle').textContent = S.title
}

function syncStatus(){
  var t = $('statusTxt'), box = $('status')
  if (!lastData) { t.textContent = '正在读取状态…'; return }
  var d = lastData
  if (d.error) { box.className = 'bad'; t.textContent = '读不到状态：' + d.error; return }
  // service worker 的离线兜底用的是 offline:true + errors[]（见 lib/sw.js）。
  // 不认这个形状的话，断网时会显示成"一切正常，没有任务在跑" —— 对监控来说，
  // 把"读不到"说成"没事"是最坏的一种错。
  if (d.offline || (d.errors && d.errors.length)) {
    box.className = 'bad'
    t.textContent = '连不上电脑：' + (d.errors && d.errors[0] ? d.errors[0] : '读不到状态')
    return
  }
  var tot = d.totals || {}
  var busy = (tot.jobsRunning || 0) + (tot.running || 0)
  var bits = []
  if ((tot.pending || 0) > 0) { box.className = 'warn'; bits.push('有 ' + tot.pending + ' 件事在等你') }
  else if (busy > 0) { box.className = 'busy'; bits.push(busy + ' 个任务正在跑') }
  else { box.className = ''; bits.push('一切正常，没有任务在跑') }
  if ((tot.sessions || 0) > 0) bits.push(tot.sessions + ' 个会话')
  if ((tot.subagents || 0) > 0) bits.push(tot.subagents + ' 个子代理')
  t.textContent = bits.join(' · ')
}

// ---------------------------------------------------------------------------
// 网络
// ---------------------------------------------------------------------------
async function post(url, body){
  var r = await fetch(url, {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify(body || {}),
    cache:'no-store'
  })
  if (r.status === 404) throw new Error('宿主没有注册这个接口')
  var d = await r.json().catch(function(){ return { error:'HTTP ' + r.status } })
  if (d && d.error) throw new Error(d.error)
  return d
}

async function send(text){
  text = String(text == null ? $('input').value : text)
  if (!text.trim()) return
  if (!S.sessionId) await ensureSession()
  if (!S.sessionId) { setSub('还没有可用会话，点右上角开一个'); return }
  S.pending = text
  renderPending()
  $('input').value = ''
  autoGrow()
  try {
    await post('/taskwatch/chat/send', {
      sessionId: S.sessionId,
      text: text,
      timeZone: (Intl.DateTimeFormat().resolvedOptions().timeZone || '')
    })
    S.running = true
    syncSend()
  } catch (e) {
    S.pending = null
    renderPending()
    setSub('发送失败：' + e.message)
    $('input').value = text
    autoGrow()
  }
}

async function stop(){
  try {
    await post('/taskwatch/chat/cancel', { sessionId: S.sessionId })
    S.running = false
    finishStreaming()
    syncSend()
  } catch (e) { setSub('停止失败：' + e.message) }
}

function autoGrow(){
  var el = $('input')
  el.style.height = 'auto'
  el.style.height = Math.min(132, el.scrollHeight) + 'px'
}

var sheet = $('sheet'), card = $('card')
function closeSheet(){ sheet.hidden = true; card.innerHTML = '' }
sheet.addEventListener('click', function(e){ if (e.target === sheet) closeSheet() })
function openSheet(html){
  card.innerHTML = '<div class="grab"></div>' + html
  sheet.hidden = false
}

async function openSessions(){
  openSheet('<h3>会话</h3><div class="note">读取中…</div>')
  var d
  try { d = await (await fetch('/taskwatch/chat/sessions', { cache:'no-store' })).json() }
  catch (e) { openSheet('<h3>会话</h3><div class="note">读取失败：' + esc(e.message) + '</div>'); return }
  if (d && d.error) { openSheet('<h3>会话</h3><div class="note">读取失败：' + esc(d.error) + '</div>'); return }
  S.sessions = (d && d.sessions) || []
  var h = '<h3>会话（' + S.sessions.length + '）</h3>'
  for (var i = 0; i < S.sessions.length; i++) {
    var s = S.sessions[i]
    var on = s.id === S.sessionId ? ' on' : ''
    var title = s.title || titles[s.id] || s.fallback || shortId(s.id)
    h += '<button class="item' + on + '" data-sess="' + esc(s.id) + '">'
      + '<span class="g"><span class="t">' + esc(title) + '</span>'
      + '<span class="s">' + esc((s.running ? '运行中 · ' : '') + hhmm(s.updatedAt) + (s.cwd ? ' · ' + s.cwd : '')) + '</span></span>'
      + '<span class="r">' + (on ? '当前' : '') + '</span></button>'
  }
  h += '<h3>操作</h3>'
  h += '<button class="pill" data-act="new">＋ 开一个新会话</button>'
  h += '<button class="pill" data-act="models">切换模型</button>'
  openSheet(h)
  var items = card.querySelectorAll('[data-sess]')
  for (var a = 0; a < items.length; a++) {
    items[a].addEventListener('click', function(){
      var id = this.getAttribute('data-sess')
      closeSheet()
      if (id !== S.sessionId) selectSession(id)
    })
  }
  var acts = card.querySelectorAll('[data-act]')
  for (var b = 0; b < acts.length; b++) {
    acts[b].addEventListener('click', async function(){
      var act = this.getAttribute('data-act')
      if (act === 'new') {
        closeSheet()
        setSub('正在开新会话…')
        try {
          var made = await post('/taskwatch/chat/create', {})
          if (made && made.sessionId) selectSession(made.sessionId)
        } catch (e) { setSub('新建失败：' + e.message) }
      } else if (act === 'models') { openModels() }
    })
  }
  // 缺标题的会话：一次批量请求补齐（最多 12 个），到一条改一条。
  var need = []
  for (var n = 0; n < S.sessions.length && need.length < 12; n++) {
    if (!S.sessions[n].title && !titles[S.sessions[n].id]) need.push(S.sessions[n].id)
  }
  if (need.length) fillTitles(need)
}

/** 批量补标题：**分小批**请求，每回来一批就就地改一次标签。
 *
 *  为什么分批：宿主补一个标题要 1~2 次持久化读（实测约 0.5s/次），一批 12 个
 *  要 5 秒多。与其让用户对着 12 个 "Projects" 干等 5 秒，不如每 4 个刷一次 ——
 *  一两秒后前几条就有名字了。宿主侧和本机都有缓存，所以只有第一次会这样。
 */
async function fillTitles(ids){
  for (var i = 0; i < ids.length; i += 4) {
    var chunk = ids.slice(i, i + 4)
    var got
    try {
      var r = await fetch('/taskwatch/chat/titles?ids=' + encodeURIComponent(chunk.join(',')), { cache:'no-store' })
      if (!r.ok) continue
      got = await r.json()
    } catch (e) { continue }
    if (!got || !got.titles) continue
    for (var id in got.titles) {
      if (!got.titles[id]) continue
      titles[id] = got.titles[id]
      var el = card.querySelector('[data-sess="' + id + '"] .t')
      if (el) el.textContent = titles[id]
      if (id === S.sessionId) $('sessTitle').textContent = titles[id]
    }
    try { localStorage.setItem('taskwatch.titles', JSON.stringify(titles)) } catch (e) {}
  }
}

async function openModels(){

  catch (e) { openSheet('<h3>切换模型</h3><div class="note">读取失败：' + esc(e.message) + '</div>'); return }

        await post('/taskwatch/chat/model', { sessionId:S.sessionId, provider:pair[0], model:pair[1] })
        setSub('模型已切换：' + pair[1])
      } catch (e) { setSub('切换失败：' + e.message) }
    })
  }
}

function kv(k, v){
  return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>'
}
async function openStatus(){
  openSheet('<h3>任务详情</h3><div class="note">读取中…</div>')
  var d = lastData
  if (!d || d.error) {
    try { d = await (await fetch('/taskwatch/data', { cache:'no-cache' })).json() } catch (e) { d = null }
  }
  if (!d) { openSheet('<h3>任务详情</h3><div class="note">读取失败</div>'); return }
  if (d.error) { openSheet('<h3>任务详情</h3><div class="note">读取失败：' + esc(d.error) + '</div>'); return }
  var t = d.totals || {}
  var h = '<h3>概览</h3>'
  h += kv('会话', (t.sessions||0) + ' 个，' + (t.running||0) + ' 个在跑')
  h += kv('后台任务', (t.jobs||0) + ' 个，' + (t.jobsRunning||0) + ' 个在跑')
  h += kv('子代理', (t.subagents||0) + ' 个')
  h += kv('待你处理', (t.pending||0) + ' 件')
  var pend = d.pending || []
  if (pend.length) {
    h += '<h3>在等你</h3>'
    for (var i = 0; i < pend.length; i++) {
      h += kv(pend[i].kind === 'approval' ? '需要批准' : '需要回答',
              (pend[i].sessionTitle || shortId(pend[i].sessionId)) + '：' + (pend[i].summary || ''))
    }
  }
  var jobs = d.jobs || []
  var running = []
  for (var j = 0; j < jobs.length; j++) {
    if (jobs[j].status === 'running' || jobs[j].status === 'stopping') running.push(jobs[j])
  }
  if (running.length) {
    h += '<h3>正在跑的后台任务</h3>'
    for (var k = 0; k < running.length; k++) h += kv(running[k].id, running[k].label || running[k].name || '')
  }
  openSheet(h)
}

// ---------------------------------------------------------------------------
// 会话切换
// ---------------------------------------------------------------------------
function selectSession(id){
  S.sessionId = id
  try { localStorage.setItem('taskwatch.session', id) } catch (e) {}
  var label = shortId(id)
  for (var i = 0; i < S.sessions.length; i++) {
    if (S.sessions[i].id === id) { label = S.sessions[i].title || titles[id] || S.sessions[i].fallback || label; break }
  }
  $('sessTitle').textContent = label
  S.items = []; S.seq = 0; S.running = false; S.streaming = null; S.pending = null
  renderAll()
  syncSend()
  openStream()
}

async function ensureSession(){
  var r
  try {
    var res = await fetch('/taskwatch/chat/sessions', { cache:'no-store' })
    if (res.status === 404) { S.chatReady = false; setSub('对话功能不可用（宿主未注册接口）'); renderAll(); return }
    r = await res.json()
  } catch (e) {
    S.chatReady = false; setSub('对话功能不可用：' + e.message); renderAll(); return
  }
  if (r && r.error) { S.chatReady = false; setSub('对话功能不可用：' + r.error); renderAll(); return }
  S.sessions = (r && r.sessions) || []
  var saved = ''
  try { saved = localStorage.getItem('taskwatch.session') || '' } catch (e) {}
  var pick = ''
  for (var i = 0; i < S.sessions.length; i++) { if (S.sessions[i].id === saved) { pick = saved; break } }
  if (!pick && S.sessions.length) pick = S.sessions[0].id
  if (pick) selectSession(pick)
  else setSub('还没有会话，点右上角开一个')
}

// ---------------------------------------------------------------------------
// 状态轮询（复用只读的 /taskwatch/data）
// ---------------------------------------------------------------------------
var lastData = null, TIMER = null
async function tick(){
  try {
    var r = await fetch('/taskwatch/data', { cache:'no-cache' })
    if (!r.ok) throw new Error('HTTP ' + r.status)
    lastData = await r.json()
  } catch (e) { lastData = { error: e.message } }
  syncStatus()
}
function startPolling(){ if (!TIMER) TIMER = setInterval(tick, 5000) }
function stopPolling(){ if (TIMER) { clearInterval(TIMER); TIMER = null } }

// ---------------------------------------------------------------------------
// 绑定与启动
// ---------------------------------------------------------------------------
$('send').addEventListener('click', function(){ if (S.running) stop(); else send() })
$('input').addEventListener('input', autoGrow)
$('input').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!S.running) send() }
})
$('sessBtn').addEventListener('click', openSessions)
$('menuBtn').addEventListener('click', openSessions)
$('status').addEventListener('click', openStatus)

// ── 深浅色切换 ────────────────────────────────────────────────────────────
// 默认跟随系统；用户手动切过之后以手动为准，并记住选择。
// 状态栏颜色从令牌里读，不在这里写死 hex —— 令牌改了它自动跟着改。
function applyTheme(t, remember){
  var dark = (t === 'dark')
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  $('themeBtn').setAttribute('aria-pressed', dark ? 'true' : 'false')
  var bgc = ''
  try {
    bgc = getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-bg-base').trim()
  } catch (e) {}
  if (bgc) {
    var ms = document.querySelectorAll('meta[name="theme-color"]')
    for (var i = 0; i < ms.length; i++) {
      var mm = ms[i].getAttribute('media') || ''
      // 带 media 的两个 meta 分别对应系统亮/暗；手动覆盖时改与当前主题相符的那个。
      if ((/dark/i.test(mm)) === dark) ms[i].setAttribute('content', bgc)
    }
  }
  if (remember) { try { localStorage.setItem('taskwatch.theme', dark ? 'dark' : 'light') } catch (e) {} }
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false)
$('themeBtn').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark'
  applyTheme(dark ? 'light' : 'dark', true)
})
// 用户没手动选过时，跟随系统的切换。老 Safari 没有 addEventListener，用 try 兜住。
try {
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e){
    var saved = ''
    try { saved = localStorage.getItem('taskwatch.theme') || '' } catch (err) {}
    if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'dark' : 'light', false)
  })
} catch (e) {}

document.addEventListener('visibilitychange', function(){
  if (document.hidden) { stopPolling(); return }
  tick(); startPolling()
  // 长时间挂起后可能错过中间事件，回前台重新取一次快照。
  if (S.sessionId) openStream()
})

// ── 统一兜住"登录没了" ────────────────────────────────────────────────────
// 任何一个请求回 401，就送去配对页。装在 fetch 上而不是散在每个调用点：
// 漏掉一处就会出现「页面永远卡在连接中」，而那种状态在手机上**没有任何自救路径**
// —— 用户既不知道该去哪，也没法清 cookie。这里一次装好，全部覆盖。
//
// 但跳之前必须确认配对页真的存在：中继可能是还没重启的旧版本，那时
// /taskwatch/pair 会 404 —— 跳过去等于把「卡在连接中」换成「一片 not found」，
// 反而更糟。新中继对该路径免鉴权回 200，旧中继回 404，所以启动探一次就够。
var pairPageOk = false
var rawFetch = window.fetch.bind(window)
rawFetch('/taskwatch/pair', { method: 'HEAD' })
  .then(function (r) { pairPageOk = (r.status === 200) })
  .catch(function () { /* 探测失败就当没有，保守降级 */ })
window.fetch = function (u, o) {
  return rawFetch(u, o).then(function (r) {
    if (r.status === 401) {
      if (pairPageOk) location.replace('/taskwatch/pair')
      throw new Error('unauthorized')
    }
    return r
  })
}

;(async function(){
  await tick()
  await ensureSession()
  if (!S.sessionId) renderAll()
  if (!document.hidden) startPolling()
})()

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/taskwatch/sw.js', { scope:'/taskwatch' })
    .catch(function(e){ console.warn('taskwatch: service worker 注册失败', e) })
}
</script>
