name: Publish

# Publishes this package to npm using Trusted Publishing (OIDC): there is no
# NODE_AUTH_TOKEN secret anywhere in this repository, and no 2FA prompt. GitHub
# mints a short-lived OIDC token for the run, npm verifies it against the
# Trusted Publisher configured for the package, and issues publish credentials
# for the duration of that one command.
#
# One-time setup, on npm (the package must already exist on the registry before
# this page will let you configure anything):
#
#   https://www.npmjs.com/package/dsh-taskwatch/settings -> Trusted Publisher
#     Organization or user: dingchenhui0618-arch
#     Repository:           dsh-taskwatch
#     Workflow filename:    publish.yml
#     Environment:          (leave empty)
#
# `id-token: write` is the whole mechanism. Drop it and npm has no OIDC token to
# exchange, falls back to looking for a token, finds none, and the run fails.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted Publishing requires npm CLI 11.5.1+; Node 22 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # lib/ is committed, so there is no build step. This is the same 15-check
      # bundle validation that runs locally.
      - name: Check the bundle
        run: npm run check

      # Guards against tagging v1.2.0 while package.json still says 1.1.0 —
      # npm would reject the publish, but this fails earlier and says why.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Publishing $pkg"

      - name: Publish
        run: npm publish --provenance --access public
